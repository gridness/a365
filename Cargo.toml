[workspace]
members = ["crates/a365dt-cli"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# external dependencies
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.16"
crossterm = "0.29"
directories = "6"
indicatif = "0.18"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pulldown-cmark = { version = "0.13", default-features = false }
rapidfuzz = "0.5"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
scraper = "0.27"
security-framework = "3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }

# test dependencies
divan = "0.1"
pretty_assertions = "1"

[profile.dev]
opt-level = "z"
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
opt-level = "z"
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
